# Access of the metrics collector (monitoring.yaml), and nothing more.
# Its loop only runs:
#   kubectl get nodes                 -> nodes: list
#   kubectl get pods --all-namespaces -> pods: list
#   kubectl get --raw /metrics        -> nonResourceURL /metrics: get
# Before: bound to cluster-admin, plus an aggregated role that could read
# every Secret and write every ConfigMap. No aggregation any more: an
# aggregated role grows whenever someone adds a ClusterRole with its label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-scraper-reader
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [list]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-scraper-reader
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-scraper-reader
subjects:
  - kind: ServiceAccount
    name: metrics-scraper
    namespace: {{ .Release.Namespace }}