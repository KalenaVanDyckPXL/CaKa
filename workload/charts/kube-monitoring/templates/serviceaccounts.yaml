# Used by the metrics collector (monitoring.yaml).
# Rotation: the old account "metrics-collector" was compromised (its token
# carried cluster-admin). Tokens are bound to the account, so replacing the
# account makes every token ever issued for the old one invalid.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-scraper
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}